name: sportoteka_stadium_android
description: Native Android Filament stadium renderer for Sportoteka.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: by.sportoteka.stadium_android
        pluginClass: SportotekaStadiumAndroidPlugin
