name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: false

      - name: Verify Flutter and Dart versions
        shell: pwsh
        run: |
          flutter --version
          dart --version
          where.exe flutter

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Clean old Windows build cache
        shell: pwsh
        run: |
          flutter clean
          if (Test-Path build\windows) {
            Remove-Item build\windows -Recurse -Force
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          CMAKE_GENERATOR_PLATFORM: "x64"
        run: flutter build windows --release

      - name: Zip Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sportoteka-windows-release.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sportoteka-windows-release-zip
          path: sportoteka-windows-release.zip

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "installer\vc_redist.x64.exe"
          Get-Item "installer\vc_redist.x64.exe" | Select-Object Name, Length

      - name: Build Windows Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\sportoteka_installer.iss"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: SportotekaSetup
          path: installer/output/SportotekaSetup.exe
